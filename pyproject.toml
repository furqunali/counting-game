[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-game"
version = "0.1.0"
description = "A testable skip-counting game with reusable domain logic."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Furqan Ali" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["counting_game_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
